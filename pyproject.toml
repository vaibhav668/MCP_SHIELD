[project]
name = "mcp-shield"
version = "0.1.0"
description = "Runtime security layer for AI agents using MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "langgraph>=1.2,<2",
    "langchain>=1.5,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "langchain-groq>=1.1.3",
    "streamlit>=1.67.0",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "langchain-google-genai>=4.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
